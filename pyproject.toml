[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "embedded-zimage-shared-preview"
version = "0.1.4"
description = "Opt-in embedded Z-Image spatial response shared-game cohort"
requires-python = ">=3.11,<3.15"
readme = "README.md"
dependencies = [
  "particle-sliders-core[hypergan-hndl] @ git+https://github.com/HyperGAN/particle-sliders.git@3dd672a7f9b8c169daef90fd63e4bb42b9ddc423#subdirectory=packages/particle-sliders-core",
  "diffusers==0.42.1",
  "safetensors==0.8.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
embedded-zimage-shared = "embedded_zimage_shared.cli:main"
embedded-zimage-cuda = "embedded_zimage_shared.cuda_cli:main"

[project.entry-points."particle_sliders.response_backends"]
embedded-zimage-shared = "embedded_zimage_shared.backend:BACKEND"
embedded-zimage-cuda-fp32 = "embedded_zimage_shared.cuda_backend:BACKEND"

[project.entry-points."particle_sliders.training_profiles"]
zimage-fixture = "embedded_zimage_shared.training_profile:fixture_profile"

[project.entry-points."particle_sliders.inference_backends"]
embedded-zimage-shared = "embedded_zimage_shared.backend:INFERENCE_BACKEND"
embedded-zimage-cuda-fp32 = "embedded_zimage_shared.cuda_backend:INFERENCE_BACKEND"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
embedded_zimage_shared = ["source_profile.json"]
